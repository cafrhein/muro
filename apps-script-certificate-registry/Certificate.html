<!doctype html>
<html lang="es">
<head>
  <base target="_top">
  <style>
    :root{--green:#0a3a2d;--muted:#57736a;--paper:#fff;--bg:#eef2f0;--danger:#a52828}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#17241f;padding:24px}
    .status{max-width:980px;margin:0 auto 14px;padding:12px 18px;border-radius:8px;background:#fff;border-left:6px solid var(--green);font-weight:700}
    .status.revoked,.status.missing{border-left-color:var(--danger);color:var(--danger)}
    .certificate{position:relative;max-width:980px;min-height:690px;margin:auto;background:var(--paper);padding:58px 70px 44px 260px;border:14px double var(--green);box-shadow:0 18px 48px #16312822;overflow:hidden}
    .ribbon{position:absolute;left:92px;top:0;bottom:0;width:92px;background:var(--green)}
    .seal{position:absolute;left:48px;top:150px;width:182px;height:182px;border:8px double var(--green);border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;color:var(--green);font-weight:800;letter-spacing:.12em}
    .seal strong{font-size:44px;display:block}.issuer{font-size:42px;color:var(--green);margin-bottom:34px}.eyebrow{font-weight:800;letter-spacing:.16em;color:var(--green)}
    h1{font-family:Georgia,serif;font-size:35px;font-weight:500;color:var(--green);margin:8px 0}.label{color:var(--muted);margin-top:12px}.participant{font-family:Georgia,serif;font-size:30px;border-bottom:1px solid #cad4d0;padding:6px 0 8px}.course{font-size:25px;font-weight:800;color:var(--green);margin:8px 0}.meta{color:var(--green);font-weight:700}.statement,.skills{font-size:14px;line-height:1.5;color:#3f504a}.skills-title{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--green);margin-top:20px}.footer{display:flex;justify-content:space-between;gap:28px;margin-top:55px;font-size:12px}.folio{text-align:right;color:var(--muted)}
    @media(max-width:760px){body{padding:10px}.certificate{padding:34px 24px 34px 110px;min-height:auto;border-width:8px}.ribbon{left:30px;width:42px}.seal{left:9px;top:120px;width:86px;height:86px;border-width:4px;font-size:7px}.seal strong{font-size:22px}.issuer{font-size:30px}.participant{font-size:23px}.footer{flex-direction:column}.folio{text-align:left}}
  </style>
</head>
<body>
<? if (!record) { ?>
  <div class="status missing">CERTIFICADO NO ENCONTRADO<? if (requestedFolio) { ?> · <?= requestedFolio ?><? } ?></div>
<? } else { ?>
  <div class="status <?= record.Status === 'REVOKED' ? 'revoked' : '' ?>">
    <?= record.Status === 'ACTIVE' ? 'CERTIFICADO AUTÉNTICO Y VIGENTE' : record.Status === 'REVOKED' ? 'CERTIFICADO REVOCADO' : 'REGISTRO NO VÁLIDO PARA CERTIFICACIÓN' ?>
  </div>
  <article class="certificate">
    <div class="ribbon"></div><div class="seal">COURSE<strong>◈</strong>COMPLETION</div>
    <div class="issuer"><?= issuer ?></div>
    <div class="eyebrow">CERTIFICADO DE FINALIZACIÓN</div>
    <h1>Constancia de formación</h1>
    <div class="label">Se otorga el presente certificado a</div>
    <div class="participant"><?= record.Participant_Name ?></div>
    <div class="label">por haber concluido satisfactoriamente el curso</div>
    <div class="course"><?= record.Course_Name ?></div>
    <div class="meta">Curso completado el <?= record.Completion_Date ?> · <?= record.Duration ?></div>
    <p class="statement"><?= record.Statement ?></p>
    <div class="skills-title">COMPETENCIAS DESARROLLADAS</div><div class="skills"><?= record.Skills ?></div>
    <footer class="footer"><div><strong><?= record.Instructor_Name ?></strong><br><?= record.Instructor_Role ?></div><div class="folio"><strong>Folio del certificado</strong><br><?= record.Folio ?><br>Emitido: <?= record.Issued_At ?></div></footer>
  </article>
  <? if (record.Status === 'REVOKED') { ?><div class="status revoked">Motivo: <?= record.Revocation_Reason ?> · Revocado: <?= record.Revoked_At ?></div><? } ?>
<? } ?>
</body>
</html>
