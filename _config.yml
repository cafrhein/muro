# ==========================================
# CONFIGURACIÓN GLOBAL - MODELO MIG
# ==========================================
title: "Modelo de Gobernanza e Integración"
description: "Una ruta abierta para diseñar organizaciones que deciden, ejecutan, miden y aprenden."
url: "https://adestrat.com"
baseurl: ""
enforce_ssl: true

# IDENTIDAD DEL AUTOR
author:
  name: Carlos Hernández
  avatar: "/perfil.png"
  twitter_username: cafrhein

# Diseño propio
theme: null

# CONFIGURACIÓN DE MOTOR
markdown: kramdown
highlighter: rouge
lsi: false

# ESTRUCTURA DE ARCHIVOS
include: [_posts, _layouts, assets]
exclude: [Gemfile, Gemfile.lock, node_modules, vendor, .github]

# CONFIGURACIÓN DE PERMALINKS
permalink: /:categories/:title/

# VALORES POR DEFECTO
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      category: "Actualidad"
  - scope:
      path: ""
    values:
      layout: "default"
